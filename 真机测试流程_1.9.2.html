<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>PTRTS 真机测试流程 · 1.9.2</title>
<style>
  :root{
    --bg:#1e1f22; --card:#2b2d31; --card2:#232529; --line:#3a3d42;
    --fg:#d6dade; --dim:#9aa1a8; --accent:#9b59b6; --accent2:#5865f2;
    --ok:#3ba55d; --bad:#ed4245; --warn:#f0b232;
    --tap:44px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
      "Microsoft YaHei",system-ui,sans-serif;font-size:16px;line-height:1.55;
    -webkit-text-size-adjust:100%}
  body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}

  /* ── 顶栏 ── */
  header{position:sticky;top:0;z-index:20;background:rgba(30,31,34,.97);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
  .hrow{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  h1{font-size:1.02rem;margin:0;font-weight:700}
  .ver{font-size:.68rem;color:var(--dim);background:#3c3f44;
    padding:2px 8px;border-radius:10px}
  .stats{font-size:.72rem;color:var(--dim);margin-left:auto;white-space:nowrap}
  .stats b{color:var(--fg)}
  .stats .b{color:var(--bad)}
  .bar{height:7px;border-radius:7px;background:#3a3d42;margin-top:9px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9b59b6,#5865f2);
    transition:width .25s ease}
  nav{display:flex;gap:6px;overflow-x:auto;margin-top:9px;padding-bottom:2px;
    scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;min-height:34px;display:flex;align-items:center;
    padding:0 12px;border-radius:17px;background:#34373c;color:#c9cdd2;
    font-size:.76rem;border:1px solid transparent;white-space:nowrap}
  .chip.on{background:var(--accent);color:#fff;border-color:#b07cc6}
  .chip.bad{border-color:var(--bad);color:#ffb3b4}

  /* ── 章节 ── */
  main{padding:12px 12px 0}
  details.sec{background:var(--card);border:1px solid var(--line);
    border-radius:14px;margin:0 0 12px;overflow:hidden}
  details.sec[open]{box-shadow:0 2px 14px rgba(0,0,0,.35)}
  summary{list-style:none;cursor:pointer;padding:14px;display:flex;
    align-items:center;gap:10px;min-height:var(--tap)}
  summary::-webkit-details-marker{display:none}
  .snum{flex:0 0 30px;height:30px;border-radius:9px;background:#3a3d42;
    display:flex;align-items:center;justify-content:center;font-size:.78rem;
    font-weight:700;color:#cfd3d8}
  .stitle{font-weight:700;font-size:.93rem;flex:1;min-width:0}
  .scount{font-size:.7rem;color:var(--dim);white-space:nowrap}
  .sec.star .snum{background:var(--accent);color:#fff}
  .sec.hot{border-color:#5b4a63}
  .caret{color:var(--dim);font-size:.7rem;transition:transform .2s}
  details[open] .caret{transform:rotate(90deg)}
  .body{padding:0 12px 12px}

  /* ── 条目 ── */
  .it{border-top:1px solid var(--line);padding:12px 0}
  .it:first-child{border-top:none}
  .ihead{display:flex;gap:10px;align-items:flex-start}
  .tick{flex:0 0 30px;height:30px;border-radius:9px;border:2px solid #565a60;
    background:transparent;display:flex;align-items:center;justify-content:center;
    font-size:.9rem;color:#7d838a;margin-top:1px;transition:all .15s}
  .it.ok .tick{background:var(--ok);border-color:var(--ok);color:#fff}
  .it.bad .tick{background:var(--bad);border-color:var(--bad);color:#fff}
  .txt{flex:1;min-width:0}
  .t{font-weight:600;font-size:.9rem}
  .it.ok .t{color:#a7d8b6}
  .it.bad .t{color:#ffc0c1}
  .meta{font-size:.78rem;color:var(--dim);margin-top:5px}
  .meta b{color:#c3c8cd;font-weight:600}
  .exp{margin-top:6px;font-size:.82rem;background:#20341f;border-left:3px solid var(--ok);
    border-radius:0 8px 8px 0;padding:7px 10px;color:#c8e6cd}
  .fail{margin-top:6px;font-size:.82rem;background:#3a2022;border-left:3px solid var(--bad);
    border-radius:0 8px 8px 0;padding:7px 10px;color:#f3c9ca}
  .warn{margin-top:6px;font-size:.8rem;background:#3a3320;border-left:3px solid var(--warn);
    border-radius:0 8px 8px 0;padding:7px 10px;color:#f0dfb4}
  .acts{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
  .btn{min-height:36px;display:inline-flex;align-items:center;gap:6px;
    padding:0 12px;border-radius:10px;background:#3a3d42;color:#cfd3d8;
    border:1px solid var(--line);font-size:.78rem}
  .btn.p{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn.f{background:var(--bad);border-color:var(--bad);color:#fff}
  code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.76rem;
    background:#191a1d;border:1px solid #303338;border-radius:6px;
    padding:1px 5px;word-break:break-all}

  /* ── 底部操作条 ── */
  .foot{position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:rgba(30,31,34,.97);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:flex;gap:8px}
  .foot .btn{flex:1;min-height:var(--tap);justify-content:center;font-size:.84rem}
  .empty{color:var(--dim);font-size:.84rem;text-align:center;padding:26px 10px}
  .hide{display:none!important}
  .toast{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(84px + env(safe-area-inset-bottom));background:#000;color:#fff;
    border:1px solid var(--line);padding:9px 15px;border-radius:11px;
    font-size:.8rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
  .toast.on{opacity:.95}
  .lead{font-size:.8rem;color:var(--dim);padding:2px 4px 12px}
  .lead b{color:#c3c8cd}
</style>
</head>

function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
function st(id){ return state[id] || ''; }           // '' | 'ok' | 'bad'
function toggle(id, v){ state[id] = (v === undefined ? (st(id)==='ok'?'':(st(id)==='bad'?'':'ok')) : v); save(); render(); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
  .replace(/`([^`]+)`/g,'<code>$1</code>'); }

var ALL = [];
SECTIONS.forEach(function(sec){
  sec.items.forEach(function(it, i){ it.id = sec.n + '.' + (i+1); ALL.push(it); });
});

function render(){
  var list = document.getElementById('list');
  var html = '';
  SECTIONS.forEach(function(sec){
    var mine = sec.items.filter(function(it){ return pass(it); });
    if (filter !== 'all' && !sec.skipAll && mine.length === 0) return;
    if (sec.skipAll && filter !== 'all') return;
    var done = sec.items.filter(function(it){ return st(it.id); }).length;
    var open = (filter !== 'all') || sec.star || done > 0;
    html += '<details class="sec' + (sec.star?' star':'') + (sec.hot?' hot':'') + '"' + (open?' open':'') + '>'
      + '<summary><span class="snum">' + esc(sec.n) + '</span>'
      + '<span class="stitle">' + esc(sec.t) + '</span>'
      + '<span class="scount">' + (sec.items.length ? done + '/' + sec.items.length : '跳过') + '</span>'
      + '<span class="caret">▶</span></summary><div class="body">';
    if (sec.lead) html += '<div class="lead">' + fmt(sec.lead) + '</div>';
    if (sec.n === '8') html += '<div class="warn"><code>PROCESS-NAME,aria2c.exe,DIRECT<br>'
      + 'PROCESS-NAME,python.exe,DIRECT<br>DOMAIN-SUFFIX,pixiv.net,PROXY<br>'
      + 'DOMAIN-SUFFIX,pximg.net,PROXY<br>MATCH,DIRECT</code></div>';
    if (sec.skipAll) { html += '</div></details>'; return; }
    mine.forEach(function(it){
      var s = st(it.id);
      html += '<div class="it ' + s + '">'
        + '<div class="ihead">'
        + '<button class="tick" data-a="ok" data-i="' + it.id + '">' + (s==='ok'?'✓':(s==='bad'?'✗':'')) + '</button>'
        + '<div class="txt"><div class="t">' + esc(it.t) + '</div>'
        + (it.s ? '<div class="meta"><b>步骤：</b>' + fmt(it.s) + '</div>' : '')
        + '<div class="exp">' + fmt(it.e) + '</div>'
        + (it.f ? '<div class="fail"><b>不对时：</b>' + fmt(it.f) + '</div>' : '')
        + (it.skip ? '<div class="warn">' + fmt(it.skip) + '</div>' : '')
        + '<div class="acts">'
        + '<button class="btn ' + (s==='ok'?'p':'') + '" data-a="ok" data-i="' + it.id + '">通过</button>'
        + '<button class="btn ' + (s==='bad'?'f':'') + '" data-a="bad" data-i="' + it.id + '">不通过</button>'
        + (it.f ? '<button class="btn" data-a="copy" data-i="' + it.id + '">复制这条</button>' : '')
        + '</div></div></div></div>';
    });
    html += '</div></details>';
  });
  list.innerHTML = html;
  document.getElementById('empty').classList.toggle('hide', html !== '');

  var done = 0, bad = 0;
  ALL.forEach(function(it){ if (st(it.id)==='ok') done++; else if (st(it.id)==='bad') { done++; bad++; } });
  var total = ALL.length;
  document.getElementById('stats').innerHTML =
    '已测 <b>' + done + '</b>/' + total + (bad ? ' · <span class="b">不通过 ' + bad + '</span>' : '');
  document.getElementById('bar').style.width = (total ? (done/total*100) : 0) + '%';
  buildFilters();
}

function pass(it){
  var s = st(it.id);
  if (filter === 'all') return true;
  if (filter === 'todo') return !s;
  if (filter === 'ok') return s === 'ok';
  if (filter === 'bad') return s === 'bad';
  if (filter === 'star') return false;   // ★ 重点用章节标记，见下
  return true;
}

var FILTERS = [['all','全部'],['todo','未测'],['ok','通过'],['bad','不通过']];
function buildFilters(){
  var nav = document.getElementById('filters');
  var bad = ALL.filter(function(it){ return st(it.id)==='bad'; }).length;
  nav.innerHTML = FILTERS.map(function(f){
    var extra = (f[0]==='bad' && bad) ? '（' + bad + '）' : '';
    return '<button class="chip' + (filter===f[0]?' on':'') + (f[0]==='bad'&&bad?' bad':'')
      + '" data-f="' + f[0] + '">' + f[1] + extra + '</button>';
  }).join('');
}

document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-a],[data-f]');
  if (!el) return;
  var f = el.getAttribute('data-f');
  if (f) { filter = f; render(); return; }
  var id = el.getAttribute('data-i'), a = el.getAttribute('data-a');
  if (a === 'ok') toggle(id, st(id)==='ok' ? '' : 'ok');
  else if (a === 'bad') toggle(id, st(id)==='bad' ? '' : 'bad');
  else if (a === 'copy') {
    var it = ALL.filter(function(x){ return x.id === id; })[0];
    var txt = '【' + it.id + '】' + it.t + '\n步骤：' + it.s + '\n期望：' + it.e
      + (it.f ? '\n不对时：' + it.f : '');
    copy(txt.replace(/\*\*/g,''));
  }
});

function copy(txt){
  var ok = function(){ toast('已复制'); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(ok, function(){ fallback(txt, ok); });
  } else { fallback(txt, ok); }
}
function fallback(txt, ok){
  var ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); ok(); } catch(e){ toast('复制失败，请长按选择'); }
  document.body.removeChild(ta);
}
var tt;
function toast(m){
  var t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove('on'); }, 1600);
}

document.getElementById('btnReport').addEventListener('click', function(){
  var bad = ALL.filter(function(it){ return st(it.id)==='bad'; });
  var todo = ALL.filter(function(it){ return !st(it.id); });
  if (!bad.length) { toast('还没有「不通过」的条目'); return; }
  var lines = ['PTRTS 1.9.2 真机测试 —— 不通过项（' + bad.length + ' 条）：'];
  bad.forEach(function(it){
    lines.push('', '【' + it.id + '】' + it.t, '  我做了什么：' + it.s,
      '  期望：' + it.e.replace(/\*\*/g,''), '  实际：', '  （这里是现象）');
  });
  if (todo.length) lines.push('', '（另有 ' + todo.length + ' 条还没测）');
  lines.push('', '已附：logs/main_faulthandler.log / crash_*.log / 最新的 prts_*.log');
  copy(lines.join('\n'));
});

document.getElementById('btnReset').addEventListener('click', function(){
  if (!confirm('清空所有勾选？')) return;
  state = {}; save(); render(); toast('已重置');
});

render();
</script>
</body>
</html>
